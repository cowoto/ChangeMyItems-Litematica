name: Release

# Builds the mod for a GitHub release and attaches the JAR to it.
# The mod version is taken from the tag: "v1.2.3" or "v.1.2.3" -> 1.2.3.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the JAR to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version from tag
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION#.}"
          echo "Tag $TAG -> mod version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Pmod_version="$VERSION"

      - name: Attach JAR to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="build/libs/litematica-material-swap-mc26.3-$VERSION.jar"
          test -f "$JAR"
          sha256sum "$JAR" | tee "$JAR.sha256"
          gh release upload "$TAG" "$JAR" "$JAR.sha256" --clobber --repo "$GITHUB_REPOSITORY"
